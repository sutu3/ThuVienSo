spring:
  application:
    name: ThuVienSo
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 2GB
      file-size-threshold: 2MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/thuvienso?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root

    hikari:
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

server:
  address: 0.0.0.0
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html
# Xoá toàn bộ block mini:
storage:
  location: D:/Code/ThuVienSo/storage         # thư mục gốc lưu file trên máy chủ
  base-url: http://192.168.2.46:8080/files/raw   # đổi sang host công khai khi deploy
mini:
  url: http://192.168.2.46:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: thuvienso
backup:
  dir: D:/Code/ThuVienSo/backup      # thư mục lưu file .sql
  mysqldump-path: "C:/Program Files/MySQL/MySQL Server 8.0/bin/mysqldump.exe"
  keep: 0


jwt:
  valid-duration: 3600
